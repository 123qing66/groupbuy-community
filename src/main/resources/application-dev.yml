spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地用学校便携版 MySQL（127.0.0.1:3308，root/123456，见 F:\JAVA开发综合实训\mysql8\README-使用说明.md）
    # CI 里由 workflow 环境变量 DB_URL / DB_PASSWORD 覆盖（3306/root）
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3308}/groupbuy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 本地默认 123456（学校便携版），CI 用环境变量 DB_PASSWORD=root 覆盖
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

logging:
  level:
    root: info
    com.groupbuy: debug
