name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: groupbuy
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Init database
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot groupbuy < src/main/resources/db/schema.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -proot groupbuy < src/main/resources/db/data.sql

      - name: Build and test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_PASSWORD: root
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: mvn -B clean package

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
